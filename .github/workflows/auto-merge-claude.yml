# Fusionne automatiquement dans main ce que Claude Code pousse sur ses branches claude/*.
name: Fusion automatique des branches Claude

on:
  push:
    branches: ["claude/**"]

permissions:
  contents: write

concurrency:
  group: auto-merge-main
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fusionner la branche dans main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          git merge --no-edit "origin/${GITHUB_REF_NAME}" -m "fusion auto : ${GITHUB_REF_NAME}"
          git push origin main
