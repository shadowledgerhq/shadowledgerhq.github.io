# Passage hebdomadaire de l'étape 1 : jeudi 01h heure de Paris (docs/SPEC_ETAPE1.md §6).
# Deux crons UTC (été : mercredi 23:00Z, hiver : jeudi 00:00Z). Le script vérifie le créneau Paris
# (jeudi 01:00-04:59) et le passage du jour. Ne gèle pas : le gel est fait par le PC (tris 3-4).
name: Passage hebdomadaire

on:
  schedule:
    - cron: "0 23 * * 3"
    - cron: "0 0 * * 4"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignorer le créneau et le passage déjà fait"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: etape1-donnees
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Passage hebdomadaire
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then python3 pipeline/etape1.py weekly --force
          else python3 pipeline/etape1.py weekly; fi
      - name: Commit et push des données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Rien à enregistrer."; exit 0; fi
          git commit -m "données: passage hebdomadaire $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
